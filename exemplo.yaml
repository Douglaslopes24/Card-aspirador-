# Aparência inicial. Você também pode ajustá-la em Mais controles → Aparência.
# theme: auto  # auto, light, dark ou "ha:Nome do seu tema"
# text_color: "#edf4f8"
# secondary_text_color: "#aabfcf"
# value_color: "#8de3d3"
# appearance_id: aspirador_sala  # Opcional: separa escolhas de cards iguais.


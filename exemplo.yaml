# Configuração mínima — substitua pelo ID real do seu aspirador.
type: custom:aspirador-vivo-card
entity: vacuum.seu_aspirador
name: Vaccum card-animations

# Sensores opcionais. Descomente e substitua pelos seus IDs.
# battery_entity: sensor.seu_aspirador_bateria
# cleaning_time_entity: sensor.seu_aspirador_tempo_de_limpeza
# mop_time_entity: sensor.seu_aspirador_tempo_dos_mops

# O sensor usa sua própria unidade, como min, s, h ou %.
# Para um atributo do aspirador, defina o nome e a unidade no YAML.
# cleaning_time_attribute: cleaning_time
# cleaning_time_unit: min
# mop_time_attribute: mop_time_left
# mop_time_unit: min
# mop_label: "Mops · tempo restante"

# show_controls: true
# animation: true
# sound: true
